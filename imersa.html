<style>
:root{--navy:#0E1B2C;--paper:#F2F5FB;--card:#FFFFFF;--ink:#0E1B2C;--muted:#5D6B82;--line:#DCE3EF;--blue:#3D5AFE;--lime:#C6F432;

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans);min-height:100vh}

button{font:inherit;color:inherit;cursor:pointer}
.in{max-width:940px;margin:0 auto;padding:0 22px}

<body>
<div class="top"><div class="in">
  <header>
    <div class="logo">imersa<i>.</i></div>
    <div class="opts">
      <select id="lang" aria-label="Idioma"></select>
      <button class="ghost" id="vocabBtn">Meu vocabulário · 0</button>
      <button class="ghost" id="theme" aria-label="Alternar tema">Tema</button>
    </div>
  </header>
  <section class="hero">
    <h1>Entenda a palavra sem traduzi-la.</h1>
    <p class="sub">Cada palavra é explicada no próprio idioma, no seu nível, com imagem, três frases e áudio. Sem tradução: o significado se forma por contexto.</p>
    <div class="modes" id="modes"><button type="button" data-m="word" aria-pressed="true">Palavra</button><button type="button" data-m="text" aria-pressed="false">Frase ou dúvida</button><button type="button" data-m="practice" aria-pressed="false">Praticar um tema</button></div>
    <form class="search" id="form" role="search">
      <input id="q" type="text" placeholder="bread" autocomplete="off" autocapitalize="off" aria-label="Palavra">
      <button type="submit" id="go">Explicar</button>
    </form>
    <div class="chips" id="chips"><span>Experimente:</span></div>
  </section>
</div></div>
<div class="in res">
  <div class="levels" id="levels" role="group" aria-label="Nível"></div>
  <main id="out" aria-live="polite"></main>
  <p class="note">Áudio gerado pela voz do seu navegador. Imagens da Wikipédia/Wikimedia Commons quando disponíveis.</p>
</div>

<script>
/* ============ CONFIGURAÇÃO ============ */
// Para aceitar QUALQUER palavra, aponte para o seu backend (veja instruções no final).
// Ele deve responder JSON: { ipa, emoji, A1:{def,ex:[3]}, B1:{...}, C1:{...} }
const API_URL = "/api/explain";           // ex.: "https://seusite.com/api/explain"
// Para adicionar um idioma: 1) uma linha aqui (voz = código do áudio, wiki = código da Wikipédia)
// 2) (opcional) palavras de demonstração em DB. Com o backend de IA, basta a linha aqui.
const LANGS = {
  en:{name:"English",  voice:"en-US", wiki:"en"},
  es:{name:"Español",  voice:"es-ES", wiki:"es"},
  fr:{name:"Français", voice:"fr-FR", wiki:"fr"},
  de:{name:"Deutsch",  voice:"de-DE", wiki:"de"},
  it:{name:"Italiano", voice:"it-IT", wiki:"it"},
  ja:{name:"日本語",    voice:"ja-JP", wiki:"ja"},
  zh:{name:"中文",      voice:"zh-CN", wiki:"zh"}
};

/* ============ BASE DE DEMONSTRAÇÃO ============ */
const DB = { en:{
 umbrella:{ipa:"/ʌmˈbrelə/",emoji:"☂️",
  A1:{def:"You hold it over your head when water falls from the sky. It keeps you dry.",ex:["I take my umbrella to work today.","The umbrella is red and big.","She has no umbrella, and she is wet."]},
  B1:{def:"A round cover on a stick that you open to protect yourself from rain or, sometimes, from strong sun.",ex:["Don't forget your umbrella; it looks like rain.","He shared his umbrella with a stranger at the bus stop.","The wind broke my umbrella on the way home."]},
  C1:{def:"A collapsible canopy mounted on a handle, used as shelter from precipitation; figuratively, a single body or idea that shelters many smaller ones.",ex:["Several charities operate under the umbrella of one larger foundation.","She kept a compact umbrella in her bag for sudden downpours.","The umbrella term covers a wide range of related conditions."]}},
 lighthouse:{ipa:"/ˈlaɪt.haʊs/",emoji:"🗼",
  A1:{def:"A tall building by the sea. It has a big light at the top. Ships see the light at night.",ex:["The lighthouse is near the water.","At night, the lighthouse light is bright.","We visit the lighthouse on Sunday."]},
  B1:{def:"A tower on the coast with a powerful light that warns ships about dangerous rocks and shows them where land is.",ex:["The old lighthouse guided sailors safely for two hundred years.","We climbed 200 steps to the top of the lighthouse.","A keeper used to live in the lighthouse and light the lamp every evening."]},
  C1:{def:"A coastal tower equipped with a beacon to aid navigation; figuratively, a person or thing that offers guidance in difficult times.",ex:["During the crisis, her calm voice was a lighthouse for the whole team.","The lighthouse swept its beam across the fog-covered bay.","Automated lighthouses have largely replaced resident keepers."]}},
 whisper:{ipa:"/ˈwɪs.pər/",emoji:"🤫",
  A1:{def:"To speak very, very quietly. Only a person near you can hear.",ex:["Please whisper in the library.","He whispers to his friend.","The baby is sleeping, so we whisper."]},
  B1:{def:"To speak in a very soft voice, using your breath more than your voice, so that others do not hear.",ex:["She whispered a secret in my ear.","They whispered during the movie and got angry looks.","I heard someone whisper my name in the dark."]},
  C1:{def:"To speak or convey something in hushed tones, often confidentially; also, to make a soft, rustling sound, or to circulate as a rumour.",ex:["It is whispered that the company will soon be sold.","The leaves whispered in the evening breeze.","He whispered his objections so as not to disrupt the meeting."]}},
 nostalgia:{ipa:"/nɒˈstæl.dʒə/",emoji:"📼",
  A1:{def:"A warm and a little sad feeling when you remember good days from before.",ex:["I feel nostalgia when I see my old school.","This song gives me nostalgia.","Grandma looks at old photos with nostalgia."]},
  B1:{def:"A mix of happiness and sadness that you feel when you think about a happy time in your past that you cannot return to.",ex:["The smell of fresh bread filled him with nostalgia.","Many people feel nostalgia for the games of their childhood.","She watched the old film with a sense of nostalgia."]},
  C1:{def:"A sentimental longing for a period or place in the past, typically one idealised in memory, often tinged with wistfulness.",ex:["The reunion was steeped in nostalgia for a simpler era.","Critics accused the director of indulging in cheap nostalgia.","Nostalgia can distort how accurately we remember the past."]}},
 harvest:{ipa:"/ˈhɑː.vɪst/",emoji:"🌾",
  A1:{def:"The time when farmers take the food from the plants in the field.",ex:["The harvest is in autumn.","Farmers work hard at harvest time.","We eat fresh corn after the harvest."]},
  B1:{def:"The gathering of crops when they are ripe, or the amount of crops collected. As a verb, to pick or collect them.",ex:["This year's wheat harvest was excellent.","They harvest the grapes by hand every September.","Bad weather ruined much of the harvest."]},
  C1:{def:"The process or season of gathering mature crops; by extension, the yield obtained, or the benefits reaped from prolonged effort.",ex:["After years of research, the team finally reaped the harvest of its patience.","A poor harvest drove food prices sharply upward.","Mechanised harvesting has transformed rural labour."]}}
},
es:{ paraguas:{ipa:"/paˈɾaɣwas/",emoji:"☂️",
  A1:{def:"Lo usas cuando llueve. Lo abres encima de tu cabeza y no te mojas.",ex:["Llevo mi paraguas al trabajo.","El paraguas es grande y rojo.","Hoy llueve, necesito un paraguas."]},
  B1:{def:"Objeto con una tela redonda y un palo que se abre para protegerte de la lluvia o, a veces, del sol fuerte.",ex:["No olvides el paraguas; parece que va a llover.","Compartió su paraguas con un desconocido en la parada.","El viento rompió mi paraguas de camino a casa."]},
  C1:{def:"Utensilio plegable de armazón cubierto de tela impermeable, que resguarda de la precipitación; en sentido figurado, aquello que ampara bajo una misma cobertura.",ex:["Varias asociaciones operan bajo el paraguas de una fundación mayor.","Guardaba un paraguas plegable en el bolso por si caía un chaparrón.","El paraguas legal de la norma cubre casos muy diversos."]}}
},
fr:{ parapluie:{ipa:"/pa.ʁa.plɥi/",emoji:"☂️",
  A1:{def:"On l'ouvre quand il pleut. Il protège ta tête de l'eau.",ex:["Je prends mon parapluie ce matin.","Le parapluie est grand et bleu.","Il pleut, j'ai besoin d'un parapluie."]},
  B1:{def:"Objet fait d'un tissu rond sur un bâton, qu'on ouvre pour se protéger de la pluie ou parfois du soleil.",ex:["N'oublie pas ton parapluie, il va pleuvoir.","Elle a partagé son parapluie avec un inconnu à l'arrêt de bus.","Le vent a cassé mon parapluie en rentrant."]},
  C1:{def:"Ustensile pliant à armature recouverte de toile imperméable, qui abrite des intempéries; au sens figuré, ce qui protège ou rassemble sous une même autorité.",ex:["Plusieurs associations travaillent sous le parapluie d'une grande fondation.","Il gardait un parapluie pliant dans son sac en cas d'averse.","Le parapluie d'un allié puissant peut rassurer un petit pays."]}}
},
de:{ regenschirm:{word:"Regenschirm",ipa:"/ˈʁeːɡn̩ʃɪʁm/",emoji:"☂️",
  A1:{def:"Du hältst ihn über deinen Kopf, wenn es regnet. Dann wirst du nicht nass.",ex:["Ich nehme meinen Regenschirm mit.","Der Regenschirm ist groß und rot.","Es regnet, ich brauche einen Regenschirm."]},
  B1:{def:"Ein runder Schutz aus Stoff an einem Stock, den man aufspannt, damit man bei Regen trocken bleibt.",ex:["Vergiss deinen Regenschirm nicht, es sieht nach Regen aus.","Er teilte seinen Regenschirm mit einem Fremden an der Haltestelle.","Der Wind hat meinen Regenschirm kaputt gemacht."]},
  C1:{def:"Ein zusammenklappbares Gestell mit wasserabweisender Bespannung, das vor Niederschlag schützt; im übertragenen Sinn ein Schutz, der vieles unter einem Dach vereint.",ex:["Der Verband spannt einen Regenschirm über viele kleine Vereine.","Sie trug stets einen Taschenregenschirm für plötzliche Schauer bei sich.","Bei Sturm nützt dir auch der beste Regenschirm nichts."]}}
},
it:{ ombrello:{ipa:"/omˈbrɛllo/",emoji:"☂️",
  A1:{def:"Lo apri quando piove. Sta sopra la tua testa e non ti bagni.",ex:["Prendo l'ombrello per andare al lavoro.","L'ombrello è grande e rosso.","Piove, ho bisogno di un ombrello."]},
  B1:{def:"Oggetto con una stoffa tonda e un manico che si apre per proteggersi dalla pioggia o, a volte, dal sole forte.",ex:["Non dimenticare l'ombrello, sembra che pioverà.","Ha diviso il suo ombrello con uno sconosciuto alla fermata.","Il vento ha rotto il mio ombrello mentre tornavo a casa."]},
  C1:{def:"Arnese pieghevole con armatura coperta di tessuto impermeabile, usato come riparo dalle precipitazioni; in senso figurato, ciò che offre protezione sotto un'unica egida.",ex:["Diverse associazioni operano sotto l'ombrello di una grande fondazione.","Teneva sempre in borsa un ombrello tascabile per gli acquazzoni improvvisi.","L'ombrello della legge non copre tutte le situazioni."]}}
}};

/* ============ ESTADO ============ */
const $ = s => document.querySelector(s);
let lastErr = "", lastSug = "";
let lang = "en", level = "A1", current = null, currentKey = "";
const LEVELS = [["A1","Iniciante","frases curtas"],["B1","Intermediário","ideias claras"],["C1","Avançado","nuances"]];
const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

/* ============ ÁUDIO (Web Speech API) ============ */
function speak(text, btn){
  if(!("speechSynthesis" in window)) return alert("Seu navegador não suporta áudio por voz.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANGS[lang].voice; u.rate = btn && btn.classList.contains("play") ? .85 : .95;
  const v = speechSynthesis.getVoices().find(v => v.lang === u.lang);
  if(v) u.voice = v;
  if(btn){ btn.classList.add("on"); u.onend = u.onerror = () => btn.classList.remove("on"); }
  speechSynthesis.speak(u);
}

/* ============ IMAGEM (Wikipédia, sem chave de API) ============ */
async function fetchImage(word){
  try{
    const url = `https://${LANGS[lang].wiki}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(word)}&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=700&format=json&origin=*`;
    const r = await (await fetch(url)).json();
    const pages = Object.values(r.query?.pages || {}).sort((a,b)=>a.index-b.index);
    const p = pages.find(p => p.thumbnail);
    return p ? {src:p.thumbnail.source, credit:"Wikipedia: "+p.title} : null;
  }catch(e){ return null; }
}

/* ============ DADOS ============ */
async function loadLevel(word, lv){
  const local = (DB[lang] || {})[word];
  if(local && !/^S/.test(lv)) return local;
  if(!API_URL) return null;
  try{
    lastSug = ""; const r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({word,lang,level:lv})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ lastSug = j.suggestion || ""; throw new Error(j.error || ("Erro "+r.status)); }
    return j;
  }catch(e){ lastErr = e.message; return null; }
}

/* ============ RENDER ============ */
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(sentence, word){
  const stem = word.length>4 ? word.slice(0,-1) : word;
  return esc(sentence).replace(new RegExp("(?<!\\p{L})("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\p{L}*)","giu"),"<mark>$1</mark>");
}
function render(){
  if(!current) return;
  const help = current.help||0, d = current[help ? "S"+help : level], w = currentKey;
  if(!d) return;
  const lvName = (LEVELS.find(l=>l[0]===level)||[])[1]||"";
  const badge = help===1 ? "Versão mais simples" : help===2 ? "Versão simplíssima" : level+" · "+lvName;
  $("#out").innerHTML = `
  <article class="card" data-lv="${level}" data-h="${help}">
    <div class="pic" id="pic"><span class="emo" aria-hidden="true">${current.emoji||"💬"}</span></div>
    <div class="body">
      <span class="badge">${badge}</span>
      <div class="word"><h2>${esc(current.word||w)}</h2><span class="ipa">${esc(current.ipa||"")}</span></div>
      <button class="play" id="say" aria-label="Ouvir a pronúncia">${ICON} Ouvir</button><button class="save" id="save">${isSaved() ? "★ Salva" : "☆ Salvar"}</button>
      <p class="def">${esc(d.def)}</p>
      <div class="row">
        ${help<2 ? `<button class="help" id="help">${help ? "Ainda não entendi" : "Não entendi"}</button>` : ""}
        ${help ? `<button class="back" id="back">Voltar ao nível ${level}</button>` : ""}
      </div>
    </div>
    <div class="ex"><h3>Veja em uso</h3><ol>
      ${d.ex.slice(0,3).map((s,i)=>`<li><button data-i="${i}" aria-label="Ouvir frase ${i+1}">${ICON}</button><span>${hl(s,w)}</span></li>`).join("")}
    </ol></div>
  </article>
  <div class="deepbar"><button class="dbtn" id="deepbtn">Aprofundar: relacionadas, colocações e registro</button></div><section id="deep"></section>`;
  $("#say").onclick = e => speak(w, e.currentTarget);
  document.querySelectorAll(".ex li button").forEach(b => b.onclick = () => speak(d.ex[b.dataset.i]));
  if($("#help")) $("#help").onclick = needHelp;
  $("#save").onclick = toggleSave; $("#deepbtn").onclick = loadDeep; if(current.deep) showDeep();
  if($("#back")) $("#back").onclick = () => { current.help = 0; render(); };
  const putImg = img => {
    const pic = $("#pic"); if(!pic) return;
    pic.insertAdjacentHTML("afterbegin",`<img alt="" src="${img.src}"><span class="credit">${esc(img.credit)}</span>`);
    pic.querySelector(".emo")?.remove();
  };
  if(current.img) putImg(current.img);
  else fetchImage(w).then(img => { if(img && currentKey===w){ current.img = img; putImg(img); } });
}
async function needHelp(){
  const w = currentKey, next = (current.help||0)+1, key = "S"+next, btn = $("#help");
  if(!current[key]){
    btn.textContent = "Preparando…"; btn.disabled = true;
    const e = await loadLevel(w, key);
    if(currentKey!==w) return;
    if(!e || !e.def){ btn.textContent = "Não consegui agora. Tente de novo"; btn.disabled = false; return; }
    current[key] = {def:e.def, ex:e.ex};
  }
  current.help = next; render();
}
const showErr = w => {
  const sug = lastSug && lastSug.toLowerCase()!==w ? lastSug : "";
  $("#out").innerHTML = `<div class="empty">` + (sug
    ? `Não encontrei “${esc(w)}”.<br>Você quis dizer <button class="sug" id="sug">${esc(sug)}</button>?`
    : `“${esc(w)}” não foi encontrada.<br>Confira a grafia e o idioma selecionado.<br><small>Detalhe: ${esc(lastErr || "sem resposta do servidor")}</small>`) + `</div>`;
  if(sug) $("#sug").onclick = () => { $("#q").value = sug; lookup(sug); };
};
async function lookup(raw){
  const w = raw.trim().toLowerCase(); if(!w) return;
  currentKey = w; current = null;
  $("#out").innerHTML = '<div class="empty">Procurando…</div>';
  const e = await loadLevel(w, level);
  if(currentKey!==w) return;
  if(!e) return showErr(w);
  current = (e.A1 || e.B1 || e.C1) ? e : {word:e.word, ipa:e.ipa, emoji:e.emoji, [level]:{def:e.def, ex:e.ex}};
  render();
}
async function ensureLevel(){
  if(!currentKey) return;
  if(current && current[level]) return render();
  const w = currentKey, lv = level;
  $("#out").innerHTML = '<div class="empty">Preparando este nível…</div>';
  const e = await loadLevel(w, lv);
  if(currentKey!==w || level!==lv) return;
  if(!e) return showErr(w);
  current = current || {word:e.word, ipa:e.ipa, emoji:e.emoji};
  current[lv] = {def:e.def, ex:e.ex}; render();
}
function drawLevels(){
  $("#levels").innerHTML = LEVELS.map(([k,n,s]) =>
    `<button class="lv" data-k="${k}" aria-pressed="${k===level}"><b>${k} · ${n}</b><span>${s}</span></button>`).join("");
  document.querySelectorAll(".lv").forEach(b => b.onclick = () => { level = b.dataset.k; if(current) current.help = 0; drawLevels(); ensureLevel(); });
}

/* ============ NOVOS RECURSOS ============ */
let mode = "word", rev = null;
async function post(path, body){
  const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ("Erro "+r.status));
  return j;
}
const busy = t => { $("#out").innerHTML = `<div class="empty">${t}</div>`; };
const fail = e => { $("#out").innerHTML = `<div class="empty">Não consegui agora.<br><small>${esc(e.message)}</small></div>`; };
const rx = w => new RegExp("(?<!\\p{L})("+(w.length>4?w.slice(0,-1):w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\p{L}*)","giu");
const exList = (arr) => `<div class="ex"><h3>Veja em uso</h3><ol>${arr.map((s,i)=>`<li><button data-i="${i}" aria-label="Ouvir">${ICON}</button><span>${esc(s)}</span></li>`).join("")}</ol></div>`;

/* --- vocabulário pessoal (salvo no navegador) --- */
const VK = "imersa_vocab";
const vocab = () => { try{ return JSON.parse(localStorage.getItem(VK)) || []; }catch(e){ return []; } };
const drawVocabBtn = () => { $("#vocabBtn").textContent = "Meu vocabulário · " + vocab().length; };
const putVocab = a => { try{ localStorage.setItem(VK, JSON.stringify(a)); }catch(e){} drawVocabBtn(); };
const isSaved = () => vocab().some(v => v.lang===lang && v.w===currentKey);
function toggleSave(){
  let a = vocab();
  if(isSaved()) a = a.filter(v => !(v.lang===lang && v.w===currentKey));
  else {
    const d = current[level] || current.A1 || current.B1 || current.C1;
    a.push({w:currentKey, lang, word:current.word||currentKey, ipa:current.ipa||"", emoji:current.emoji||"", def:d.def, ex:d.ex, ok:0, no:0});
  }
  putVocab(a); $("#save").textContent = isSaved() ? "★ Salva" : "☆ Salvar";
}
function showVocab(){
  currentKey = ""; rev = null;
  const a = vocab().filter(v => v.lang===lang);
  $("#out").innerHTML = `<div class="panel"><div class="vhead"><h2>Meu vocabulário · ${LANGS[lang].name}</h2><div class="row">
    <button class="help" id="vrev" ${a.length?"":"disabled"}>Revisar</button>
    <button class="help" id="vsum" ${a.length>1?"":"disabled"}>Resumo inteligente</button></div></div>
    <div id="vbox">${a.length ? a.map(v=>`<div class="vi"><span class="vemo">${v.emoji||"💬"}</span><div><b>${esc(v.word)}</b> <small>${esc(v.ipa)}</small><p>${esc(v.def)}</p></div>
      <button class="mini" data-a="say" data-w="${esc(v.w)}" aria-label="Ouvir">${ICON}</button><button class="back" data-a="del" data-w="${esc(v.w)}">remover</button></div>`).join("")
      : `<p class="muted">Nenhuma palavra salva neste idioma. Pesquise uma palavra e clique em ☆ Salvar.</p>`}</div></div>`;
  document.querySelectorAll("#vbox [data-a]").forEach(b => b.onclick = () => {
    const v = a.find(x => x.w===b.dataset.w);
    if(b.dataset.a==="say") speak(v.word);
    else { putVocab(vocab().filter(x => !(x.lang===lang && x.w===v.w))); showVocab(); }
  });
  $("#vrev").onclick = () => { rev = {a:[...a].sort((x,y)=>(x.ok-x.no)-(y.ok-y.no)), i:0}; stepReview(); };
  $("#vsum").onclick = summarize;
}
function stepReview(){
  const {a,i} = rev, box = $("#vbox");
  if(i>=a.length){ box.innerHTML = `<p class="def">Revisão concluída. 🎉</p>`; return; }
  const v = a[i], cloze = esc((v.ex||[])[0]||"").replace(rx(v.w), "_____");
  box.innerHTML = `<small class="muted">${i+1} de ${a.length}</small><p class="def">${esc(v.def)}</p><p>${cloze}</p>
    <div class="row" id="ans"><button class="help" id="show">Mostrar a palavra</button></div>`;
  $("#show").onclick = () => {
    $("#ans").innerHTML = `<b class="big">${esc(v.word)}</b><button class="mini" id="rs" aria-label="Ouvir">${ICON}</button><button class="help" id="ok">Lembrei</button><button class="help" id="no">Ainda não</button>`;
    speak(v.word); $("#rs").onclick = () => speak(v.word);
    const fin = g => { const all = vocab(), t = all.find(x => x.lang===v.lang && x.w===v.w); if(t){ t[g]++; putVocab(all); } rev.i++; stepReview(); };
    $("#ok").onclick = () => fin("ok"); $("#no").onclick = () => fin("no");
  };
}
async function summarize(){
  $("#vbox").innerHTML = '<p class="muted">Organizando suas palavras…</p>';
  try{
    const j = await post("/api/summary",{lang,level,words:vocab().filter(v=>v.lang===lang).map(v=>v.word)});
    $("#vbox").innerHTML = (j.groups||[]).map(g=>`<div class="sec"><h3>${esc(g.theme)}</h3><p>${(g.words||[]).map(w=>`<span class="tag">${esc(w)}</span>`).join(" ")}</p><p class="muted">${esc(g.note||"")}</p></div>`).join("")
      + (j.tip ? `<p class="tipbox">${esc(j.tip)}</p>` : "");
  }catch(e){ $("#vbox").innerHTML = `<p>Não consegui agora.<br><small>${esc(e.message)}</small></p>`; }
}

/* --- aprofundar: registro, colocações, relacionadas, diferenças --- */
async function loadDeep(){
  const w = currentKey, b = $("#deepbtn"); b.textContent = "Preparando…"; b.disabled = true;
  try{ current.deep = await post("/api/deep",{word:w,lang,level}); }
  catch(e){ b.textContent = "Não consegui agora. Tente de novo"; b.disabled = false; return; }
  if(currentKey===w) showDeep();
}
function showDeep(){
  const d = current.deep, r = d.register||{}, el = $("#deep"); if(!el) return;
  $("#deepbtn")?.remove();
  const FM = {formal:"Formal",neutral:"Neutra",informal:"Informal"}, MD = {spoken:"Mais falada",written:"Mais escrita",both:"Fala e escrita"};
  const TG = {weaker:"mais fraca",similar:"parecida",stronger:"mais forte"};
  el.innerHTML = `<div class="deep">
    <h3>Registro</h3><p><span class="tag">${FM[r.formality]||esc(r.formality||"")}</span> <span class="tag">${MD[r.medium]||esc(r.medium||"")}</span> ${esc(r.note||"")}</p>
    <h3>Combinações naturais</h3><ul class="plain">${(d.collocations||[]).map(c=>`<li><button class="mini" data-s="${esc(c.phrase)}" aria-label="Ouvir">${ICON}</button><b>${esc(c.phrase)}</b><span>${esc(c.note||"")}</span></li>`).join("")}</ul>
    <h3>Palavras relacionadas</h3><ul class="plain">${(d.related||[]).map(x=>`<li><b>${esc(x.word)}</b><span class="tag t-${esc(x.intensity)}">${TG[x.intensity]||""}</span><span>${esc(x.note||"")}</span></li>`).join("")}</ul>
    <h3>Não dá para trocar</h3><ul class="plain">${(d.contrast||[]).map(x=>`<li><b>${esc(x.pair)}</b><span>${esc(x.rule||"")}</span></li>`).join("")}</ul></div>`;
  el.querySelectorAll(".mini").forEach(b => b.onclick = () => speak(b.dataset.s));
}

/* --- corrigir frases e tirar dúvidas de gramática --- */
async function checkText(txt){
  txt = txt.trim(); if(!txt) return;
  currentKey = ""; busy("Analisando seu texto…");
  try{
    const j = await post("/api/check",{text:txt,lang,level});
    $("#out").innerHTML = `<article class="card chk" data-lv="${level}"><div class="body wide">
      <span class="badge">${j.kind==="answer" ? "Resposta" : "Correção"} · ${level}</span>
      ${j.corrected ? `<p class="def">${esc(j.corrected)}</p><button class="play" id="say" aria-label="Ouvir">${ICON} Ouvir</button>` : ""}
      ${(j.issues||[]).map(i=>`<div class="iss"><s>${esc(i.wrong)}</s> → <b>${esc(i.right)}</b><p>${esc(i.why||"")}</p></div>`).join("")}
      <p class="expl">${esc(j.explain||"")}</p></div>${(j.ex||[]).length ? exList(j.ex) : ""}</article>`;
    if($("#say")) $("#say").onclick = e => speak(j.corrected, e.currentTarget);
    document.querySelectorAll(".ex li button").forEach(b => b.onclick = () => speak(j.ex[b.dataset.i]));
  }catch(e){ fail(e); }
}

/* --- praticar um tema: atividades + correção final --- */
let pr = null;
const norm = s => String(s||"").toLowerCase().trim().replace(/[.!?,;:]+$/,"").replace(/\s+/g," ");
async function startPractice(theme){
  theme = theme.trim(); if(!theme) return;
  currentKey = ""; busy("Montando suas atividades…");
  try{
    const j = await post("/api/practice",{theme,lang,level});
    pr = {theme, title:j.title||theme, items:j.items||[]}; drawPractice();
  }catch(e){ fail(e); }
}
function drawPractice(){
  const it = pr.items;
  $("#out").innerHTML = `<div class="panel"><div class="vhead"><h2>${esc(pr.title)}</h2><span class="badge">${level}</span></div>
    ${it.map((x,i)=>`<div class="act"><small class="muted">${i+1} de ${it.length}</small><p class="def">${esc(x.q)}</p>
      ${x.type==="choice" ? `<div class="opts2">${(x.options||[]).map((o,k)=>`<button type="button" class="opt" data-i="${i}" data-k="${k}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`
        : x.type==="fill" ? `<input class="inp" id="in${i}" autocomplete="off" aria-label="Resposta">`
        : `<textarea class="inp" id="in${i}" rows="3" aria-label="Seu texto"></textarea>`}
      <div id="fb${i}"></div></div>`).join("")}
    <div class="row" style="margin-top:18px"><button class="dbtn" id="grade">Corrigir tudo</button></div><div id="score"></div></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    document.querySelectorAll(`.opt[data-i="${b.dataset.i}"]`).forEach(o => o.setAttribute("aria-pressed", o===b));
    it[b.dataset.i].pick = +b.dataset.k;
  });
  $("#grade").onclick = gradePractice;
}
async function gradePractice(){
  const btn = $("#grade"); btn.disabled = true; btn.textContent = "Corrigindo…";
  let ok = 0, total = 0, written = null;
  pr.items.forEach((x,i) => {
    document.querySelectorAll(`.opt[data-i="${i}"]`).forEach(o => o.disabled = true);
    if(x.type==="write"){ written = {i, txt:$("#in"+i).value.trim()}; return; }
    total++;
    let good, right;
    if(x.type==="choice"){ good = x.pick===x.answer; right = (x.options||[])[x.answer]; }
    else { const v = norm($("#in"+i).value); right = x.answer; good = !!v && [x.answer,...(x.alts||[])].some(a => norm(a)===v); }
    if(good) ok++;
    $("#fb"+i).innerHTML = `<p class="${good?"yes":"no"}">${good ? "✓ Correto" : "✗ Resposta certa: <b>"+esc(right)+"</b>"}</p><p class="muted">${esc(x.why||"")}</p>`;
  });
  if(written && written.txt){
    try{
      const j = await post("/api/check",{text:written.txt,lang,level});
      $("#fb"+written.i).innerHTML = (j.corrected ? `<p class="def">${esc(j.corrected)}</p>` : "")
        + (j.issues||[]).map(x=>`<div class="iss"><s>${esc(x.wrong)}</s> → <b>${esc(x.right)}</b><p>${esc(x.why||"")}</p></div>`).join("")
        + `<p class="muted">${esc(j.explain||"")}</p>`;
    }catch(e){ $("#fb"+written.i).innerHTML = `<p class="no">Não consegui corrigir o texto agora.</p>`; }
  }
  $("#score").innerHTML = `<p class="tipbox">Você acertou <b>${ok} de ${total}</b> nas questões objetivas. ${ok===total ? "Excelente!" : ok>=total/2 ? "Bom caminho. Releia as explicações dos erros." : "Vale rever o tema e tentar de novo."}</p>
    <div class="row"><button class="help" id="again">Novas atividades sobre este tema</button></div>`;
  $("#again").onclick = () => startPractice(pr.theme);
  btn.remove();
}

drawVocabBtn(); $("#vocabBtn").onclick = showVocab;
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll("#modes button").forEach(x => x.setAttribute("aria-pressed", x===b));
  $("#q").placeholder = {word:"bread",text:"Escreva uma frase para corrigir ou faça uma pergunta (ex.: may ou might?)",practice:"Qual tema você está estudando? (ex.: passado simples, comida, may e might)"}[mode];
  $("#go").textContent = {word:"Explicar",text:"Corrigir",practice:"Criar atividades"}[mode];
});

/* ============ INÍCIO ============ */
function drawChips(){
  $("#chips").innerHTML = "<span>Experimente:</span>";
  Object.keys(DB[lang] || {}).forEach(w => {
    const c = document.createElement("button"); c.className="chip"; c.type="button"; c.textContent=w;
    c.onclick = () => { $("#q").value=w; lookup(w); }; $("#chips").append(c);
  });
}
$("#lang").innerHTML = Object.entries(LANGS).map(([k,v]) => `<option value="${k}">${v.name}</option>`).join("");
drawChips();
$("#form").onsubmit = e => { e.preventDefault(); ({word:lookup,text:checkText,practice:startPractice}[mode])($("#q").value); };
$("#lang").onchange = e => {
  lang = e.target.value; current = null; currentKey = "";
  $("#out").innerHTML = ""; $("#q").value = ""; speechSynthesis.cancel(); drawChips();
};
let darkOn = matchMedia("(prefers-color-scheme: dark)").matches;
$("#theme").onclick = () => { darkOn = !darkOn; document.documentElement.dataset.theme = darkOn ? "dark" : "light"; };
if("speechSynthesis" in window) speechSynthesis.getVoices();
const SAMPLES = ["bread","pan","pain","Brot","pane","パン","面包"]; let si = 0;
setInterval(() => { if(mode==="word" && document.activeElement!==$("#q")) $("#q").placeholder = SAMPLES[si = (si+1)%SAMPLES.length]; }, 2200);
drawLevels();
